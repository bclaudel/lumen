[tasks.format]
description = "Format all tracked QML files"
run = "git ls-files -z -- '*.qml' | xargs -0r /usr/lib/qt6/bin/qmlformat -s .qmlformat.ini -i"

[tasks.format-check]
description = "Check that tracked QML files match qmlformat output"
run = '''
tmpdir=$(mktemp -d)
trap 'rm -rf "$tmpdir"' EXIT

git ls-files -z -- '*.qml' | xargs -0 -r -n1 sh -ceu '
  tmpdir=$1
  file=$2
  mkdir -p "$tmpdir/$(dirname "$file")"
  cp "$file" "$tmpdir/$file"
  /usr/lib/qt6/bin/qmlformat -s .qmlformat.ini -i "$tmpdir/$file"

  if ! cmp -s "$file" "$tmpdir/$file"; then
    printf "Formatting mismatch: %s\n" "$file" >&2
    diff -u --label "a/$file" --label "b/$file" "$file" "$tmpdir/$file" || true
    exit 1
  fi
' sh "$tmpdir"

'''

[tasks.format-staged-check]
description = "Check that staged QML files match qmlformat output"
run = '''
tmpdir=$(mktemp -d)
trap 'rm -rf "$tmpdir"' EXIT

git diff --cached --name-only --diff-filter=ACMR -z -- '*.qml' | xargs -0 -r -n1 sh -ceu '
  tmpdir=$1
  file=$2

  mkdir -p "$tmpdir/$(dirname "$file")"
  cp "$file" "$tmpdir/$file"
  /usr/lib/qt6/bin/qmlformat -s .qmlformat.ini -i "$tmpdir/$file"

  if ! cmp -s "$file" "$tmpdir/$file"; then
    printf "Formatting mismatch: %s\n" "$file" >&2
    diff -u --label "a/$file" --label "b/$file" "$file" "$tmpdir/$file" || true
    exit 1
  fi
' sh "$tmpdir"
'''

[tasks.lint]
description = "Lint tracked QML files with Qt 6 qmllint"
run = '''
qmllint=/usr/lib/qt6/bin/qmllint
build_dir=""

if [ -f .qmlls.ini ]; then
  while IFS= read -r line; do
    case "$line" in
      buildDir=*)
        build_dir=${line#buildDir=}
        build_dir=${build_dir#\"}
        build_dir=${build_dir%\"}
        break
        ;;
    esac
  done < .qmlls.ini
fi

if [ -n "$build_dir" ] && [ -d "$build_dir/qs" ]; then
  printf '%s\n' "Using Quickshell tooling VFS at $build_dir"
  git ls-files -z -- '*.qml' | xargs -0 -r -n1 sh -ceu '
    build_dir=$1
    qmllint=$2
    src=$3
    vfs_file="$build_dir/qs/$src"

    if [ ! -e "$vfs_file" ]; then
      printf "Missing VFS mirror for %s\n" "$src" >&2
      exit 1
    fi

    printf "Linting %s\n" "$src"
    "$qmllint" -I "$build_dir" -I /usr/lib/qt6/qml "$vfs_file"
  ' sh "$build_dir" "$qmllint"
else
  printf '%s\n' "Warning: Quickshell tooling VFS not available; falling back to direct source linting."
  git ls-files -z -- '*.qml' | xargs -0 -r -n1 sh -ceu '
    qmllint=$1
    src=$2

    printf "Linting %s\n" "$src"
    "$qmllint" "$src"
  ' sh "$qmllint"
fi
'''

[tasks.pre-commit]
description = "Run staged non-mutating checks used by the local pre-commit hook"
depends = ["format-staged-check"]

[tasks.check]
description = "Run non-mutating repository checks"
depends = ["format-check"]
